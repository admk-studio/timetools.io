services:
  timetools:
    build: .
    ports:
      - "8080:8080"
    environment:
      TT_BASE_URL: localhost:8080
      # Set to "true" when running behind a reverse proxy that sets
      # X-Forwarded-For (Traefik, Caddy, nginx, Coolify).
      TT_TRUST_PROXY: "false"
      # Optional footer link shown on the HTML pages of your instance:
      #   TT_LINK_TEXT: example.com
      #   TT_LINK_URL: https://example.com
    restart: unless-stopped
